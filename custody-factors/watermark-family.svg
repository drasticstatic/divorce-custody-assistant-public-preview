<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none" role="img" aria-label="A family of three holding hands">
  <g>
    <!-- Parent A (indigo) -->
    <circle cx="120" cy="46" r="12" fill="#818cf8"/>
    <path d="M112 60 L 100 132 Q 120 138 140 132 L 128 60 A 8 8 0 0 0 112 60 Z" fill="#818cf8"/>
    <!-- Parent B (indigo) -->
    <circle cx="200" cy="46" r="12" fill="#818cf8"/>
    <path d="M192 60 L 180 132 Q 200 138 220 132 L 208 60 A 8 8 0 0 0 192 60 Z" fill="#818cf8"/>
    <!-- Child (amber), smaller, centered and slightly forward -->
    <circle cx="160" cy="58" r="8" fill="#f4c067"/>
    <path d="M153 70 L 145 120 Q 160 124 175 120 L 167 70 A 7 7 0 0 0 153 70 Z" fill="#f4c067"/>
    <!-- connecting hand arcs (thin) -->
    <path d="M138 112 Q 150 108 146 116" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M175 116 Q 182 108 182 112" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- heart-spark above the child (amber) -->
    <path transform="translate(150,22) scale(0.85)" d="M12 21 C12 21 4 13.7 4 8.7 A4.5 4.5 0 0 1 12 6.6 A4.5 4.5 0 0 1 20 8.7 C20 13.7 12 21 12 21 Z" fill="#f4c067"/>
  </g>
</svg>
