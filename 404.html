<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./vocational-compliance/favicon.svg" type="image/svg+xml"/>
    <title>404 — Not Found · Divorce & Custody Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617; --panel: rgba(15, 23, 42, 0.88);
        --text: #e2e8f0; --muted: #94a3b8;
        --accent: #38bdf8; --accent-2: #818cf8;
        --border: rgba(148, 163, 184, 0.22);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100vh; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 32%),
          linear-gradient(180deg, #0f172a 0%, var(--bg) 100%);
        color: var(--text);
      }
      main {
        width: min(100%, 570px); padding: 40px 32px;
        border: 1px solid var(--border); border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      }
      .code {
        margin: 0; font-size: clamp(3rem, 12vw, 5rem); font-weight: 800;
        line-height: 1; letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .eyebrow {
        margin: 0 0 10px; font-size: 0.74rem; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
      }
      p { margin: 14px auto 0; max-width: 32rem; line-height: 1.6; color: var(--muted); }
      .cta {
        display: inline-block; margin-top: 26px; padding: 13px 22px;
        border-radius: 999px; background: var(--accent); color: #082f49;
        font-weight: 700; text-decoration: none;
      }
      .cta:hover { filter: brightness(1.1); }
      .foot {
        margin-top: 22px; font-size: 0.8rem; color: var(--muted);
      }
      .foot a { color: var(--accent-2); text-decoration: none; }
      .foot a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Divorce & Custody Assistant</p>
      <p class="code">404</p>
      <p>This page or resource was not found
        <br><br>It may have been renamed, moved, pruned by the privacy-preserving sync pipeline, or never published to the public preview.</p>
      <a class="cta" href="https://drasticstatic.github.io/divorce-custody-assistant-public-preview/">Navigate back HOME to Index &#8599;</a>
      <div class="foot">
        <a href="https://github.com/drasticstatic/divorce-custody-assistant-public-preview">View GitHub Repository &#8599;</a>
      </div>
    </main>
  </body>
</html>
